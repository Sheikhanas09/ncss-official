# Netlify settings. Netlify's Next.js support is detected automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer
  NODE_VERSION = "22"
  # These two are public on purpose: the browser needs them to reach Supabase.
  # The anon/publishable key is safe to expose; Supabase's row-level security
  # only lets the admin account change anything. Don't add secret keys here.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"
